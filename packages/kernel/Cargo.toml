[package]
name = "solyx-kernel"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
napi = { version = "3.15.0", features = ["napi8"] }
napi-derive = "3"
rayon = "1.12.0"

[build-dependencies]
napi-build = "2"

[profile.release]
codegen-units = 1
lto = true
