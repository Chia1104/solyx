# Once CI passes on a push to develop, packages Solyx Nightly as its own prerelease, whose notes list
# what was merged since the previous nightly. A newer push cancels a nightly still packaging.
name: Nightly

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  version:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # A nightly previews the next patch release, which the stable release workflow promotes it to.
      - id: version
        run: |
          next=$(node -p '
            const [major, minor, patch] = require("./apps/desktop/package.json").version.split(".").map(Number);
            `${major}.${minor}.${patch + 1}`
          ')
          echo "version=$next-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    uses: ./.github/workflows/package.yml
    with:
      channel: nightly
      ref: ${{ github.event.workflow_run.head_sha }}
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, package]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: Publish the nightly
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 \
            --json tagName --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\."))][0] // ""')
          {
            echo "Solyx Nightly installs beside Solyx and keeps its own data, settings and keys."
            echo
            echo "Neither installer is signed by a paid certificate yet."
            echo
            echo "- **macOS (Apple Silicon):** open the app once, then allow it under System Settings → Privacy & Security → Open Anyway."
            echo "- **Windows:** when SmartScreen stops the installer, choose More info → Run anyway."
          } > notes.md
          gh release create "v$VERSION" installers/*.dmg installers/*.exe --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --prerelease --latest=false --title "Solyx Nightly $VERSION" \
            --notes-file notes.md --generate-notes ${previous:+--notes-start-tag "$previous"}

      # The installers go up before the feed that names them, so no app reads a version it cannot
      # download. Only the newest nightly is kept; its release on GitHub keeps the rest.
      - name: Upload to download.usesolyx.trade
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          TARGET: s3://${{ vars.R2_BUCKET }}/nightly/
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          aws s3 cp installers/ "$TARGET" --recursive --exclude "*.yml"
          aws s3 cp installers/ "$TARGET" --recursive --exclude "*" --include "*.yml"
          aws s3 rm "$TARGET" --recursive --exclude "*" --include "Solyx-*" --exclude "Solyx-$VERSION.*"
