# Checks, tests and builds every push to develop and every pull request; Nightly only packages a
# commit on develop that passed it.
name: CI

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true

      - run: vp check
      # The kernel's tests and the app's build compile it with the Rust its rust-toolchain.toml names.
      - run: rustup toolchain install
        working-directory: packages/kernel
      - run: vp run -r test
      # The website's build reads the releases from GitHub's API, which limits callers without a token.
      - run: vp run -r build
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Fails a pull request on the dead code, complexity and duplication it introduces, not on what its
  # base branch already has.
  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The audit attributes each finding by comparing with the base branch's history.
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true

      - run: vp exec fallow audit --format github-annotations
        env:
          FALLOW_AUDIT_BASE: origin/${{ github.base_ref }}
