# Checks, tests and builds every push to develop and every pull request; Nightly waits on it.
name: CI

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true

      - run: vp check
      - run: vp run -r test
      - run: vp run -r build
