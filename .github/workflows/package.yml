# Packages the desktop app on macOS and Windows and uploads the installers as artifacts.
name: Package

on:
  workflow_call:
    inputs:
      channel:
        description: "`stable` or `nightly`"
        type: string
        required: true
      ref:
        type: string
        required: true
      version:
        description: Replaces the app's version for this build
        type: string
        default: ""

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        # macos-26 carries the Xcode 26 that compiles the Icon Composer icons.
        runner: [macos-26, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true

      - name: Set the version
        if: inputs.version != ''
        working-directory: apps/desktop
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
            manifest.version = process.env.VERSION;
            fs.writeFileSync("package.json", `${JSON.stringify(manifest, null, 2)}\n`);
          '

      - name: Package
        env:
          SCRIPT: ${{ inputs.channel == 'nightly' && 'package:nightly' || 'package' }}
        run: vp run "@solyx/desktop#$SCRIPT"

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.runner }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
          if-no-files-found: error
