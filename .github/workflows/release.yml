# Promotes the latest nightly to a stable release: its commit is packaged as Solyx `v<version>`, the
# notes list what was merged since the previous stable release, develop takes the new version and
# main moves to the released commit.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version, such as 1.2.0; defaults to the latest nightly's
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.nightly.outputs.sha }}
      version: ${{ steps.nightly.outputs.version }}
    steps:
      - id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 \
            --json tagName --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\."))][0] // ""')
          if [ -z "$tag" ]; then
            echo "::error::There is no nightly to promote"
            exit 1
          fi
          version=${INPUT_VERSION:-$(echo "$tag" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+)-nightly\..*/\1/')}
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version $version is not X.Y.Z"
            exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::v$version is already released"
            exit 1
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          echo "Promoting $tag ($sha) to v$version"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    needs: resolve
    uses: ./.github/workflows/package.yml
    with:
      channel: stable
      ref: ${{ needs.resolve.outputs.sha }}
      version: ${{ needs.resolve.outputs.version }}

  publish:
    needs: [resolve, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: installers
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 100 \
            --json tagName --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0] // ""')
          {
            echo "Neither installer is signed by a paid certificate yet."
            echo
            echo "- **macOS (Apple Silicon):** open the app once, then allow it under System Settings → Privacy & Security → Open Anyway."
            echo "- **Windows:** when SmartScreen stops the installer, choose More info → Run anyway."
          } > notes.md
          gh release create "v$VERSION" installers/* --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --latest --title "Solyx $VERSION" \
            --notes-file notes.md --generate-notes ${previous:+--notes-start-tag "$previous"}

  finalize:
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      # Pushes made with the workflow token start no workflows, so this commit cuts no nightly.
      - name: Record the version on develop and move main to the release
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          node -e '
            const fs = require("node:fs");
            const path = "apps/desktop/package.json";
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            manifest.version = process.env.VERSION;
            fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          '
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): prepare v$VERSION"
          git push origin HEAD:develop
          git push origin "$SHA:refs/heads/main"
