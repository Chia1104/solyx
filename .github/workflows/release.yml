# Once CI passes on main, release-please keeps the release pull request current. Merging that pull
# request tags the release and writes CHANGELOG.md; this workflow then attaches the installers and
# merges the release back into develop, so nightly builds carry the new version.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # The default branch is develop, which only nightly builds come from.
          target-branch: main

  package:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/package.yml
    with:
      channel: stable
      ref: ${{ needs.release-please.outputs.tag }}

  attach:
    needs: [release-please, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: installers
          merge-multiple: true

      - name: Attach the installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh release upload "$TAG" installers/* --repo "$GITHUB_REPOSITORY"
          {
            echo "Neither installer is signed by a paid certificate yet."
            echo
            echo "- **macOS (Apple Silicon):** open the app once, then allow it under System Settings → Privacy & Security → Open Anyway."
            echo "- **Windows:** when SmartScreen stops the installer, choose More info → Run anyway."
            echo
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body
          } > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

  merge-back:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      - name: Merge the release into develop
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-edit "$TAG"
          git push origin develop
