    # Before 1.0 a minor release may change the API, so it is pinned.
    "@tanstack/react-pacer": 0.24.1
    "@tanstack/react-query": 5.107.1
    "@tanstack/react-query-devtools": 5.107.1
    "@tanstack/react-router": 1.170.46
    # react-start pins the router exactly; upgrade the two together.
    "@tanstack/react-start": 1.169.5
  utils:
    "@bufbuild/protobuf": 2.17.0
    fast-xml-parser: 5.12.0
    tar: 7.5.22
    yaml: 2.9.1
  webauthn:
    "@simplewebauthn/browser": 14.0.0
    "@simplewebauthn/server": 14.1.0
  website:
    "@base-ui/react": 1.9.0
    "@fontsource-variable/archivo": 5.3.0
    "@fontsource-variable/noto-sans-tc": 5.3.1
    class-variance-authority: 0.7.1
    cn: 0.5.2
    shadcn: 4.23.0
    shaders: 4.0.7
    void: 1.7.0

# esbuild (through drizzle-kit), sentry-cli (through Sentry's Vite plugin) and workerd (through Void)
# run from their platform packages; their install scripts only verify them, or download one when it
# is missing. pi-ai's Google SDK and protobufjs only print notices from theirs. electron-winstaller's
# picks 7-Zip for electron-builder's Squirrel.Windows target, which Solyx does not build. Void loads
# better-sqlite3 only for a local database, which the website does not have.
allowBuilds:
  "@google/genai": false
  "@sentry/cli": false
  better-sqlite3: false
  electron-winstaller: false
  esbuild: false
  protobufjs: false
  workerd: false

# pdfjs-dist is read only for its CMaps, never to render, so its native canvas is not installed.
# sandbox-runtime loads Microsoft's container SDK only for its Windows backend, which Solyx does
# not use, so that SDK's native modules are not installed either.
ignoredOptionalDependencies:
  - "@napi-rs/canvas"
  - "@microsoft/mxc-sdk"

# Vitest takes the OpenTelemetry API as an optional peer, so each version of it in the graph makes
# another copy of Vite+, and a test that imports another package's module would reach one whose
# Vitest is not running it. Every package therefore gets the API the OpenTelemetry SDK takes.
overrides:
  vite@*: "catalog:"
  "@opentelemetry/api": "catalog:otel"
# Chord names the one ws release its own servers were tested on, and Solyx starts none of them:
# the agent takes only Chord's types, and the backend's edge runs on the ws of the server catalog.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
    "@earendil-works/chord>ws": "8"
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0"
  - vite-plus@1.0.0
  - '@earendil-works/chord@1.2.0'
  - '@earendil-works/pi-ai@1.2.0'
  - '@earendil-works/pi-durable@1.2.0'
  - '@earendil-works/pi-mcp@1.2.0'
  - '@earendil-works/pi-telemetry@1.2.0'
  - '@earendil-works/pi-codemode@1.2.0'
  - openai@7.30.0
  - '@fumadocs/language@0.2.15'
# oRPC's peer transports (a window's port, a paired browser's socket) send a FormData body's
# type from its blob, which browsers lowercase with its multipart boundary, so a message carrying
# a file could not be read. Still so in 0.13.0; drop the patch once upstream takes the header's.
patchedDependencies:
  '@standard-server/peer@0.10.3': patches/@standard-server__peer@0.10.3.patch
