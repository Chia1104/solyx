packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

# The default catalog holds the Vite+ toolchain: `overrides` and `vp upgrade` both target it.
catalog:
  "@types/node": ^26.6.6
  es-toolkit: 1.53.2
  ky: ^2.2.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  zod: 4.6.7

catalogs:
  ai:
    "@typesafe-ai/sdk": 0.7.0
    openai: 7.55.0
  charts:
    "@types/d3-hierarchy": 3.1.7
    "@types/d3-scale": 4.0.9
    "@types/d3-shape": 3.2.0
    d3-hierarchy: 3.1.3
    d3-scale: 4.0.3
    d3-shape: 3.2.1
    lightweight-charts: 5.3.0
  docs:
    "@fumadocs/language": 0.2.19
    "@types/mdx": 2.0.14
    fumadocs-core: 16.18.4
    fumadocs-mdx: 15.5.3
    # The examples' default build of Fumadocs' UI, on Base UI; the plain npm package is its Radix build.
    fumadocs-ui: npm:@fumadocs/base-ui@16.18.4
    # rehype-katex renders with katex 0.16, so its stylesheet comes from the same version.
    katex: 0.16.47
    lucide-react: 1.72.0
    rehype-katex: 7.0.1
    remark-math: 6.0.0
    takumi-js: 2.20.0
  drizzle:
    # 1.0.0-rc.5 ships only as commit builds; drizzle-kit must match drizzle-orm exactly.
    drizzle-kit: 1.0.0-rc.5-5935859
    drizzle-orm: 1.0.0-rc.5-5935859
  electron:
    electron: ^45.3.0
    electron-builder: 26.18.0
    electron-updater: 6.8.11
  forms:
    "@hookform/resolvers": ^7.0.5
    react-hook-form: ^7.92.0
  heroui-v3:
    "@heroui/react": 3.2.7
    "@heroui/styles": 3.2.7
    "@internationalized/date": 3.12.4
    react-aria-components: 1.22.1
  i18n:
    i18next: 27.1.1
    react-i18next: 18.0.1
  icons:
    "@hugeicons/core-free-icons": 4.4.0
    "@hugeicons/react": 1.1.10
    "@lobehub/icons-static-svg": 1.102.0
  lint:
    "@chiastack/oxlint": ^1.1.0
    fallow: 3.42.0
  markdown:
    "@streamdown/cjk": 1.0.4
    diff: 9.0.0
    streamdown: 2.7.1
  native:
    "@napi-rs/cli": 3.10.12
  orpc:
    "@orpc/client": 2.0.0-beta.43
    "@orpc/contract": 2.0.0-beta.43
    "@orpc/publisher": 2.0.0-beta.43
    "@orpc/server": 2.0.0-beta.43
    "@orpc/tanstack-query": 2.0.0-beta.43
  otel:
    "@opentelemetry/api": 1.10.0
    "@opentelemetry/exporter-logs-otlp-http": 0.301.1
    "@opentelemetry/exporter-trace-otlp-http": 0.301.1
    "@opentelemetry/resources": 3.1.1
    "@opentelemetry/sdk-logs": 3.1.1
    "@opentelemetry/sdk-trace": 3.1.1
    "@opentelemetry/semantic-conventions": 1.45.0
  pdf:
    # unpdf bundles pdf.js 6.4.299, whose CMaps for CJK text ship from the same release of pdfjs-dist.
    pdfjs-dist: 6.4.299
    unpdf: 2.1.0
  pi:
    "@earendil-works/chord": 1.5.2
    "@earendil-works/pi-ai": 1.5.2
    "@earendil-works/pi-codemode": 1.5.2
    "@earendil-works/pi-durable": 1.5.2
    "@earendil-works/pi-mcp": 1.5.2
  react:
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    "@vitejs/plugin-react": ^6.3.0
    react: ^19.3.1
    react-dom: ^19.3.1
    zustand: 5.1.0
  sandbox:
    # A research preview whose API may change between releases, so it is pinned.
    "@anthropic-ai/sandbox-runtime": 0.0.82
  sentry:
    "@sentry/electron": 8.4.0
    "@sentry/vite-plugin": 11.12.0
  server:
    "@hono/node-server": 2.1.7
    "@types/ws": 8.18.2
    hono: 4.13.18
    ws: 8.22.2
  tailwindcss:
    "@tailwindcss/vite": 4.3.5
    tailwindcss: 4.3.5
  tanstack:
