packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

# The default catalog holds the Vite+ toolchain: `overrides` and `vp upgrade` both target it.
catalog:
  "@types/node": ^26.6.5
  es-toolkit: 1.52.0
  ky: ^2.2.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  zod: 4.6.6

catalogs:
  ai:
    "@typesafe-ai/sdk": 0.6.0
    openai: 7.32.0
  charts:
    "@types/d3-hierarchy": 3.1.7
    d3-hierarchy: 3.1.2
    lightweight-charts: 5.2.1
  drizzle:
    # 1.0.0-rc.5 ships only as commit builds; drizzle-kit must match drizzle-orm exactly.
    drizzle-kit: 1.0.0-rc.5-5935859
    drizzle-orm: 1.0.0-rc.5-5935859
  electron:
    electron: ^44.7.0
    electron-builder: 26.17.0
    electron-updater: 6.8.10
  forms:
    "@hookform/resolvers": ^5.9.1
    react-hook-form: ^7.90.0
  heroui-v3:
    "@heroui/react": 3.2.6
    "@heroui/styles": 3.2.6
    "@internationalized/date": 3.12.4
    react-aria-components: 1.22.1
  i18n:
    i18next: 26.4.3
    react-i18next: 17.0.16
  icons:
    "@hugeicons/core-free-icons": 4.3.5
    "@hugeicons/react": 1.1.10
    "@lobehub/icons-static-svg": 1.95.1
  lint:
    "@chiastack/oxlint": ^1.1.0
    # Pinned to the oxlint bundled by vite-plus; upgrade both together.
    "@oxlint/plugins": 1.87.0
  markdown:
    "@streamdown/cjk": 1.0.4
    streamdown: 2.7.0
  orpc:
    "@orpc/client": 2.0.0-beta.43
    "@orpc/contract": 2.0.0-beta.43
    "@orpc/publisher": 2.0.0-beta.43
    "@orpc/server": 2.0.0-beta.43
    "@orpc/tanstack-query": 2.0.0-beta.43
  otel:
    "@opentelemetry/api": 1.9.1
    "@opentelemetry/api-logs": 0.223.0
    "@opentelemetry/exporter-logs-otlp-http": 0.223.0
    "@opentelemetry/exporter-trace-otlp-http": 0.223.0
    "@opentelemetry/resources": 2.12.0
    "@opentelemetry/sdk-logs": 0.223.0
    "@opentelemetry/sdk-trace-base": 2.12.0
    "@opentelemetry/semantic-conventions": 1.43.0
  pi:
    "@earendil-works/chord": 1.2.0
    "@earendil-works/pi-ai": 1.2.0
    "@earendil-works/pi-codemode": 1.2.0
    "@earendil-works/pi-durable": 1.2.0
    "@earendil-works/pi-mcp": 1.2.0
  react:
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    "@vitejs/plugin-react": ^6.1.2
    react: ^19.3.0
    react-dom: ^19.3.0
    zustand: 5.0.15
  sentry:
    "@sentry/electron": 8.1.0
    "@sentry/vite-plugin": 5.4.1
  tailwindcss:
    "@tailwindcss/vite": 4.3.3
    tailwindcss: 4.3.3
  tanstack:
    "@tanstack/react-hotkeys": 0.13.0
    "@tanstack/react-query": 5.104.2
    "@tanstack/react-query-devtools": 5.104.2
    "@tanstack/react-router": 1.170.42
  utils:
    fast-xml-parser: 5.11.2
    tar: 7.5.22
    yaml: 2.9.1

# esbuild (through drizzle-kit) and sentry-cli (through Sentry's Vite plugin) run from their platform
# packages; their install scripts only verify them, or download one when it is missing.
# pi-ai's Google SDK and protobufjs only print notices from theirs. electron-winstaller's picks 7-Zip
# for electron-builder's Squirrel.Windows target, which Solyx does not build.
allowBuilds:
  "@google/genai": false
  "@sentry/cli": false
  electron-winstaller: false
  esbuild: false
  protobufjs: false

overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0"
  - vite-plus@1.0.0
  - '@earendil-works/chord@1.2.0'
  - '@earendil-works/pi-ai@1.2.0'
  - '@earendil-works/pi-durable@1.2.0'
  - '@earendil-works/pi-mcp@1.2.0'
  - '@earendil-works/pi-telemetry@1.2.0'
  - '@earendil-works/pi-codemode@1.2.0'
  - openai@7.30.0
