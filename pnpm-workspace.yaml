packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

# The default catalog holds the Vite+ toolchain: `overrides` and `vp upgrade` both target it.
catalog:
  "@types/node": ^26
  es-toolkit: 1.52.0
  jsonc-parser: 3.3.1
  ky: ^2.1.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  zod: 4.6.5

catalogs:
  agent:
    "@earendil-works/chord": 1.0.0
    "@earendil-works/pi-ai": 1.0.0
    "@earendil-works/pi-codemode": 1.0.2
    "@earendil-works/pi-durable": 1.0.0
    "@earendil-works/pi-mcp": 1.0.0
    yaml: 2.9.0
  charts:
    lightweight-charts: 5.2.1
  chiastack:
    "@chiastack/oxlint": ^1.1.0
  decisions:
    "@typesafe-ai/sdk": 0.6.0
  electron:
    electron: ^44.4.5
  drizzle:
    # 1.0.0-rc.5 ships only as commit builds; drizzle-kit must match drizzle-orm exactly.
    drizzle-kit: 1.0.0-rc.5-5935859
    drizzle-orm: 1.0.0-rc.5-5935859
  forms:
    "@hookform/resolvers": ^5.9.1
    react-hook-form: ^7.89.0
  heroui-v3:
    "@heroui/react": 3.2.6
    "@heroui/styles": 3.2.6
    react-aria-components: 1.21.1
  i18n:
    i18next: 26.4.2
    react-i18next: 17.0.15
  markdown:
    "@streamdown/cjk": 1.0.3
    streamdown: 2.6.0
  news:
    firecrawl: 4.42.1
  oxc:
    # Pinned to the oxlint bundled by vite-plus; upgrade both together.
    "@oxlint/plugins": 1.85.0
  react:
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    "@vitejs/plugin-react": ^6.1.1
    react: ^19.3.0
    react-dom: ^19.3.0
  tailwindcss:
    "@tailwindcss/vite": 4.3.3
    tailwindcss: 4.3.3
  tanstack:
    "@tanstack/react-hotkeys": 0.12.1
    "@tanstack/react-query": 5.104.0
    "@tanstack/react-router": 1.170.40
  ui:
    "@hugeicons/core-free-icons": 4.3.5
    "@hugeicons/react": 1.1.10
    zustand: 5.0.15

# esbuild (through drizzle-kit) runs from its platform package; its install script only verifies it.
# pi-ai's Google SDK and protobufjs only print notices from theirs.
allowBuilds:
  "@google/genai": false
  esbuild: false
  protobufjs: false

overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0"
  - vite-plus@1.0.0
  - '@earendil-works/chord@1.0.0'
  - '@earendil-works/pi-ai@1.0.0'
  - '@earendil-works/pi-durable@1.0.0'
  - '@earendil-works/pi-mcp@1.0.0'
  - '@earendil-works/pi-telemetry@1.0.0'
  - '@earendil-works/pi-codemode@1.0.2'
