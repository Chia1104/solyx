# The nightly channel. Its own product name gives it its own data, config folder and secret store
# entry, so it installs beside the stable app.
extends: build/electron-builder.yml
appId: dev.chia1104.solyx.nightly
productName: Solyx Nightly
extraMetadata:
  productName: Solyx Nightly
publish:
  provider: generic
  url: https://download.usesolyx.trade/nightly
mac:
  icon: icon-nightly.icon
win:
  icon: icon-nightly.ico
