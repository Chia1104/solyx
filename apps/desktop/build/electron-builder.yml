# Packages what `vp run build` wrote to dist/, which already bundles every dependency but Electron.
appId: dev.chia1104.solyx
directories:
  buildResources: resources
  output: release
files:
  - dist/**
# The release workflows upload each channel's installers and update feed to its folder, where
# electron-updater reads the feed of the channel it was built for.
publish:
  provider: generic
  url: https://download.usesolyx.trade/stable
# The app's own binary unseals the secrets and the trading mandate, so its fuses refuse every way
# another program could run code as it: Node mode, NODE_OPTIONS, the inspector, and app code that is
# not the app.asar whose hash packaging records in the binary.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
# A nightly's version names its channel, so the two channels' installers never share a name.
artifactName: Solyx-${version}.${ext}
mac:
  # Icon Composer's icon follows the system appearance; the build machine needs Xcode 26 or later.
  icon: icon.icon
  category: public.app-category.finance
  target: dmg
  # Ad-hoc signed until there is a Developer ID. The hardened runtime, on by default, keeps other
  # programs from injecting code through DYLD_ variables or attaching a debugger.
  identity: "-"
  entitlements: build/entitlements.mac.plist
  # Helpers load Electron's frameworks, and the utility process the broker SDK the user downloaded.
  entitlementsInherit: build/entitlements.mac.plist
win:
  # icon.ico, from buildResources, holds a full-bleed rendering per size; Windows does not pad icons.
  target: nsis
